services:
  course-heatmap:
    build:
      context: .
      dockerfile: Dockerfile
    # ports:
    #   - '3000:3000'
    environment:
      - NODE_ENV=production
    volumes:
      - ./courses.json:/app/courses.json:rw
      - ./storage:/app/storage
    restart: unless-stopped
  cloudflare-tunnel:
    image: cloudflare/cloudflared
    container_name: cloudflare-tunnel
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel run
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      test: [ "CMD", "cloudflared", "--version" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s